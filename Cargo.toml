# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
resolver = "3"
members = [
    "crates/libreburn-core",
    "crates/libreburn-driver-ruida",
    "crates/libreburn-driver-lmc",
    "crates/libreburn-service",
    "crates/libreburn-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/koepnick/libreburn"
authors = ["libreburn contributors"]

[workspace.dependencies]
libreburn-core = { path = "crates/libreburn-core", version = "0.1.0" }
libreburn-driver-ruida = { path = "crates/libreburn-driver-ruida", version = "0.1.0" }
libreburn-driver-lmc = { path = "crates/libreburn-driver-lmc", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
pyo3 = "0.30"
serialport = { version = "4.10", default-features = false }
kurbo = { version = "0.13", features = ["serde"] }
usvg = { version = "0.50", default-features = false }
dxf = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
