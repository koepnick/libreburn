# SPDX-License-Identifier: AGPL-3.0-or-later
# Starting point for the Flatpak build (PL-6). The packaging spike on the Pi 5
# will turn this into a tested manifest; Python dependencies are expected to
# be generated with flatpak-pip-generator.
id: io.github.koepnick.libreburn
runtime: org.kde.Platform
runtime-version: "6.8"
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: "6.8"
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: libreburn
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --share=network        # Ethernet Ruida boards and the local service API
  - --device=all           # USB access for EZCAD2 LMC boards
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: libreburnd
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/libreburnd/cargo
    build-commands:
      - cargo build --release --locked -p libreburn-service
      - install -Dm755 target/release/libreburnd /app/bin/libreburnd
    sources:
      - type: dir
        path: ../..
  - name: libreburn-python
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps --no-build-isolation python/libreburn python/libreburn-desktop
    sources:
      - type: dir
        path: ../..
