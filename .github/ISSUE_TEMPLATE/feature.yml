name: Feature request
description: Suggest something new
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: What would you like to do?
    validations: { required: true }
  - type: textarea
    id: how
    attributes:
      label: How do you do it today, if at all?
