# SPDX-License-Identifier: AGPL-3.0-or-later
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "libreburn-desktop"
version = "0.1.0"
description = "libreburn desktop client (PySide6 / Qt 6) with an embedded IPython console"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = ["libreburn", "PySide6>=6.7"]

[project.optional-dependencies]
console = ["qtconsole>=5.6", "ipykernel>=6"]

[project.scripts]
libreburn = "libreburn_desktop.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/libreburn_desktop"]
