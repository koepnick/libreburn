# SPDX-License-Identifier: AGPL-3.0-or-later
[build-system]
requires = ["maturin>=1.16.0,<2"]
build-backend = "maturin"

[project]
name = "libreburn"
description = "Python SDK for the libreburn laser control service"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dynamic = ["version"]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Operating System :: POSIX :: Linux",
    "Typing :: Typed",
]

[project.optional-dependencies]
repl = ["ipython>=8"]

[project.urls]
Repository = "https://github.com/koepnick/libreburn"

[tool.maturin]
manifest-path = "../../crates/libreburn-py/Cargo.toml"
python-source = "src"
module-name = "libreburn._core"
features = ["extension-module"]
