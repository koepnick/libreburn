# OmTech K40 with a Ruida controller. Model and scramble key still to confirm.

[machine]
name = "OmTech K40 (Ruida)"
driver = "ruida"
laser = "co2"

[work_area]
width_mm = 300
height_mm = 200

[limits]
max_power_pct = 70           # protect the tube; raise only if the tube is rated for it
max_speed_mm_s = 400
accel_mm_s2 = 3000
max_continuous_on_s = 600
duty_cycle_pct = 80
hard = []

[framing]
default_source = "laser_off"

[connection]
transport = "udp"            # or "serial", with serial_port = "/dev/ttyUSB0"
host = "192.168.1.100"
magic = 0x88
