# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "libreburn-py"
description = "PyO3 bindings for libreburn (Python module libreburn._core)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
libreburn-core.workspace = true
libreburn-driver-ruida.workspace = true
serde.workspace = true
serde_json.workspace = true
pyo3 = { workspace = true, features = ["abi3-py311"] }

[features]
# maturin turns this on when building the wheel.
extension-module = ["pyo3/extension-module"]

[lints]
workspace = true
