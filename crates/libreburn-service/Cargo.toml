# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "libreburn-service"
description = "libreburn service (libreburnd): owns machines and jobs, serves the HTTP and WebSocket API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "libreburnd"
path = "src/main.rs"

[dependencies]
libreburn-core.workspace = true
libreburn-driver-ruida.workspace = true
libreburn-driver-lmc.workspace = true
axum = { workspace = true, features = ["ws"] }
clap.workspace = true
serde.workspace = true
kurbo.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", default-features = false }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
